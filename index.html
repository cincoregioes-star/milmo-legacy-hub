<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MilMo Legacy Hub</title></head><body style="margin:0;background:#071521;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh"><div id="loading">Carregando MilMo Legacy Hub...</div><script>(async()=>{try{const f=['app-1.part','app-2.part','app-3.part','app-4.part'];const p=await Promise.all(f.map(x=>fetch(x,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(x);return r.text()})));document.open();document.write(p.join(''));document.close()}catch(e){document.getElementById('loading').textContent='Erro ao carregar a plataforma. Atualize a página.';console.error(e)}})();</script></body></html>
